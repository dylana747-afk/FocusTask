name: ci-cd

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Lint + tests backend
        working-directory: app/backend
        run: npm ci && npm run lint && npm test
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: app/backend/Dockerfile }
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: app/frontend/Dockerfile }

  build:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}/focustask-${{ matrix.component }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_USER }}/focustask-${{ matrix.component }}:latest

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Ansible staging
        working-directory: infra/ansible
        run: ansible-playbook deploy-staging.yml -e tag=${{ github.sha }}

  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Ansible prod
        working-directory: infra/ansible
        run: ansible-playbook deploy-prod.yml -e tag=${{ github.sha }}

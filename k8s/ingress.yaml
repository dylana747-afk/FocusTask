apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: focustask
spec:
  tls:
    - hosts: [focustask.local]
      secretName: focustask-tls
  rules:
    - host: focustask.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }

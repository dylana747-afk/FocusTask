apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # pas de "replicas" : c'est le HPA qui gère
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: dockerienesgi/focustask-backend
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: focustask-secrets, key: db-password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: focustask-secrets, key: jwt-secret } }
            - name: MONGO_URI
              value: mongodb://focus:$(DB_PASSWORD)@mongo:27017/focustask?authSource=admin
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop: { exec: { command: ["sleep", "5"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app: backend }
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: backend }

- name: Déploiement FocusTask en production (k3s)
  hosts: localhost
  connection: local
  vars:
    tag: latest
    k8s_dir: "{{ playbook_dir }}/../../k8s"
  tasks:
    - name: Namespace
      shell: kubectl create namespace app --dry-run=client -o yaml | kubectl apply -f -
    - name: Secrets applicatifs
      shell: >
        kubectl -n app create secret generic focustask-secrets
        --from-literal=db-password='{{ db_password }}'
        --from-literal=jwt-secret='{{ jwt_secret }}'
        --dry-run=client -o yaml | kubectl apply -f -
      no_log: true
    - name: Tag des images
      replace:
        path: "{{ k8s_dir }}/kustomization.yaml"
        regexp: 'newTag: .*'
        replace: 'newTag: "{{ tag }}"'
    - name: Utilisateur Docker Hub dans les manifests
      replace:
        path: "{{ k8s_dir }}/{{ item }}"
        regexp: 'dockerienesgi/'
        replace: "{{ dockerhub_user }}/"
      loop: [kustomization.yaml, backend.yaml, frontend.yaml]
    - name: Apply
      command: kubectl apply -k {{ k8s_dir }}
    - name: Attente du rolling update
      command: kubectl -n app rollout status deployment/{{ item }} --timeout=180s
      loop: [backend, frontend]

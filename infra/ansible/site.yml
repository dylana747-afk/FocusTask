# Installe tout l'environnement depuis des VMs vierges (Ubuntu 24.04)
- name: Base commune
  hosts: all
  become: true
  tasks:
    - name: Paquets de base
      apt:
        name: [curl, ca-certificates, git]
        update_cache: true

- name: Staging (Docker)
  hosts: staging
  become: true
  tasks:
    - name: Docker + compose
      apt:
        name: [docker.io, docker-compose-v2]
        state: present
    - name: Docker démarré
      service: { name: docker, state: started, enabled: true }
    - name: Utilisateur dans le groupe docker
      user: { name: "{{ ansible_user }}", groups: docker, append: true }

- name: Kubernetes master (k3s server)
  hosts: k8s_master
  become: true
  tasks:
    - name: Install k3s server
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644 --tls-san {{ ansible_host }}" sh -
      args: { creates: /usr/local/bin/k3s }
    - name: Lecture du token
      slurp: { src: /var/lib/rancher/k3s/server/node-token }
      register: k3s_token
    - name: Récupération du kubeconfig sur ctrl
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        flat: true
    - name: Kubeconfig pointe vers le master
      delegate_to: localhost
      become: false
      replace:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
        regexp: '127\.0\.0\.1'
        replace: "{{ ansible_host }}"

- name: Kubernetes worker (k3s agent)
  hosts: k8s_worker
  become: true
  tasks:
    - name: Install k3s agent
      shell: >
        curl -sfL https://get.k3s.io |
        K3S_URL=https://{{ hostvars['k8s-master'].ansible_host }}:6443
        K3S_TOKEN={{ hostvars['k8s-master'].k3s_token.content | b64decode | trim }} sh -
      args: { creates: /usr/local/bin/k3s }

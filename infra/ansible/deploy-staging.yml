- name: Déploiement FocusTask en staging
  hosts: staging
  become: true
  vars:
    app_dir: /opt/focustask
    tag: latest
  tasks:
    - name: Dossier applicatif
      file: { path: "{{ app_dir }}", state: directory }
    - name: Copie du compose
      copy:
        src: "{{ playbook_dir }}/../../docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
    - name: Pull + up (seuls les conteneurs modifiés sont recréés)
      command: docker compose up -d --pull always --no-build
      args: { chdir: "{{ app_dir }}" }
      environment:
        TAG: "{{ tag }}"
        DOCKERHUB_USER: "{{ dockerhub_user }}"
        DB_PASSWORD: "{{ db_password }}"
        JWT_SECRET: "{{ jwt_secret }}"
